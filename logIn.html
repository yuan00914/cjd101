<!-- ========== main ========== -->
    <div class="login">
        <img class="Banner" src="pic2/bgi_header.png" alt="Banner">
        <img class="mobileBanner" src="pic2/mobile_header.png" alt="mobileBanner">

        <form class="form" id="loginForm">
            <div class="login-group">
                <label for="user-id">您的手機號碼就是會員帳號</label><br>
                <input type="text" placeholder="輸入手機帳號" id="user-id" name="phoneNumber" required>
                <span class="error-message" id="phoneError"></span>
            </div>

            <div class="btn-group">
                <button type="submit" class="login-btn" id="mainLoginBtn">登入/註冊</button>  
                <!-- 未輸入資料時禁用 -->
                
                <p>───── 或 ─────</p>

                <button class="login-fb">
                    <img src="pic/icon/fb_color.svg" alt="social-icon">使用Facebook快速登入
                </button>
                <button class="login-line">
                    <img src="pic/icon/line_color.svg" alt="social-icon">使用LINE快速登入
                </button>
            </div>
            
            <div class="attention">
                <p>擁有帳號即表示您同意<br><a href="">會員權益聲明</a> 與 <a href="">隱私權及網站條款</a></p>
            </div>
        </form>

        <p class="login-text">提醒您：<br>我們不會以電話或簡訊通知變更付款方式，<br>也不會要您前往ATM進行任何操作。<br>若有任何疑慮，請洽詢165反詐騙專線。</p>
    </div>
</div>
